backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: "pages"
    label: "Páginas"
    files:
      - name: "quienes_somos"
        label: "Quiénes somos"
        file: "content/pages/menu1.json"
        fields:
          - { name: "title", label: "Título", widget: "string" }
          - { name: "style", label: "Estilo", widget: "select", options: ["default", "fancy"], required: false }
          - label: "Secciones"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - { name: "heading", label: "Encabezado", widget: "string" }
              - { name: "body", label: "Contenido", widget: "text" }
          - label: "Cards (Quiénes somos)"
            name: "cards"
            widget: "list"
            required: false
            fields:
              - { name: "title", label: "Título", widget: "string" }
              - { name: "text", label: "Texto", widget: "text" }
              - { name: "mediaSide", label: "Posición media", widget: "select", options: ["left", "right", "top"], required: false }
              - { name: "image", label: "Imagen (opcional)", widget: "image", required: false }

      - name: "admision"
        label: "Admisión"
        file: "content/pages/admision.json"
        fields:
          - { name: "title", label: "Título", widget: "string" }
          - label: "Pasos"
            name: "steps"
            widget: "list"
            fields:
              - { name: "num", label: "Número", widget: "number" }
              - { name: "title", label: "Título del paso", widget: "string" }
              - { name: "subtitle", label: "Subtítulo", widget: "string", required: false }
              - { name: "text", label: "Texto", widget: "text" }
              - { name: "img", label: "Imagen/Icono", widget: "image", allow_multiple: false, required: false }
              - { name: "reverse", label: "Invertir (imagen a la izquierda)", widget: "boolean", required: false }

  - name: "levels"
    label: "Niveles"
    label_singular: "Nivel"
    folder: "content/levels"
    create: false
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "heroImage", label: "Imagen principal", widget: "image", required: false }
      - { name: "description", label: "Descripción", widget: "text" }
      - label: "Actividades"
        name: "activities"
        widget: "list"
        fields:
          - { name: "title", label: "Título", widget: "string" }
          - { name: "text", label: "Texto", widget: "text" }
          - { name: "icon", label: "Icono (opcional)", widget: "image", required: false }

  # NUEVO: colección para TALLERES (se edita un solo archivo con una lista de items)
  - name: "talleres"
    label: "Talleres"
    files:
      - name: "lista"
        label: "Listado de talleres"
        file: "content/activities/activities.json"
        fields:
          - label: "Talleres"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Título", widget: "string" }
              - { name: "text", label: "Descripción", widget: "text", required: false }
              - { name: "image", label: "Imagen", widget: "image", allow_multiple: false }
